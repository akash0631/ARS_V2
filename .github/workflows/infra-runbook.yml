name: Infra Runbook (manual)

# Manual-only workflow for prod infrastructure tasks that need to run from a
# network-reachable host. Replaces the local-machine runbook in
# BACKUP_RESTORE_RUNBOOK.md when the operator's machine cannot reach Azure.
#
# Does NOT modify any application code, build, or deploy step. Existing
# deploy.yml is untouched.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do (dry_run is read-only)'
        type: choice
        required: true
        default: dry_run
        options:
          - dry_run
          - migrate
          - ltr
          - migrate_and_ltr
      sql_db:
        description: 'Target Azure SQL database name'
        type: string
        required: true
        default: Rep_data

permissions:
  contents: read

jobs:
  discovery:
    name: Connection + schema discovery
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      runner_ip: ${{ steps.ip.outputs.ip }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve runner public IP
        id: ip
        run: echo "ip=$(curl -fsS https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Add temp firewall rule for runner
        run: |
          az sql server firewall-rule create \
            --resource-group "${{ vars.SQL_RG }}" \
            --server "${{ vars.SQL_SERVER }}" \
            --name "ghrun-${{ github.run_id }}" \
            --start-ip-address "${{ steps.ip.outputs.ip }}" \
            --end-ip-address "${{ steps.ip.outputs.ip }}"

      - name: Install msodbcsql18 + pyodbc
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
          pip install --quiet pyodbc

      - name: Discover schema (read-only)
        env:
          SQL_SERVER: ${{ vars.SQL_SERVER }}.database.windows.net
          SQL_DB: ${{ inputs.sql_db }}
          SQL_USER: ${{ vars.SQL_USER }}
          SQL_PWD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          python <<'PY'
          import os, pyodbc
          cs = (
              "DRIVER={ODBC Driver 18 for SQL Server};"
              f"SERVER={os.environ['SQL_SERVER']};"
              f"DATABASE={os.environ['SQL_DB']};"
              f"UID={os.environ['SQL_USER']};"
              f"PWD={os.environ['SQL_PWD']};"
              "Encrypt=yes;TrustServerCertificate=no;Connection Timeout=30"
          )
          cn = pyodbc.connect(cs)
          cu = cn.cursor()
          srv, db, who = cu.execute("SELECT @@SERVERNAME, DB_NAME(), SUSER_NAME()").fetchone()
          print(f"Connected: server={srv} db={db} as={who}")
          got = cu.execute("""
              SELECT name FROM sys.objects
              WHERE type='U' AND name IN
                ('Master_FOCUS_LIST','ARS_ALLOC_HEALTH_HISTORY','Master_ST_SPECIFIC')
              ORDER BY name
          """).fetchall()
          print("Target tables already present:", [r[0] for r in got] or "none")
          n = cu.execute(
              "SELECT COUNT(*) FROM sys.objects WHERE type='U' AND name LIKE 'Master_ALC_INPUT%'"
          ).fetchone()[0]
          print(f"Master_ALC_INPUT_* tables: {n}")
          cn.close()
          PY

      - name: Remove temp firewall rule
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group "${{ vars.SQL_RG }}" \
            --server "${{ vars.SQL_SERVER }}" \
            --name "ghrun-${{ github.run_id }}" || true

  migrate:
    name: Apply 021/022/023
    if: ${{ inputs.mode == 'migrate' || inputs.mode == 'migrate_and_ltr' }}
    needs: discovery
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Resolve runner public IP
        id: ip
        run: echo "ip=$(curl -fsS https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Add temp firewall rule for runner
        run: |
          az sql server firewall-rule create \
            --resource-group "${{ vars.SQL_RG }}" \
            --server "${{ vars.SQL_SERVER }}" \
            --name "ghrun-${{ github.run_id }}-mig" \
            --start-ip-address "${{ steps.ip.outputs.ip }}" \
            --end-ip-address "${{ steps.ip.outputs.ip }}"

      - name: Install msodbcsql18 + pyodbc
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
          pip install --quiet pyodbc

      - name: Apply migrations 021/022/023
        env:
          SQL_SERVER: ${{ vars.SQL_SERVER }}.database.windows.net
          SQL_DB: ${{ inputs.sql_db }}
          SQL_USER: ${{ vars.SQL_USER }}
          SQL_PWD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          python <<'PY'
          import os, glob, pyodbc, re
          cs = (
              "DRIVER={ODBC Driver 18 for SQL Server};"
              f"SERVER={os.environ['SQL_SERVER']};"
              f"DATABASE={os.environ['SQL_DB']};"
              f"UID={os.environ['SQL_USER']};"
              f"PWD={os.environ['SQL_PWD']};"
              "Encrypt=yes;TrustServerCertificate=no;Connection Timeout=30"
          )
          cn = pyodbc.connect(cs, autocommit=True)
          cu = cn.cursor()
          targets = ('021_focus_list_table.sql',
                     '022_alloc_health_history.sql',
                     '023_st_specific_overrides.sql')
          for fn in targets:
              path = os.path.join('backend','scripts',fn)
              print(f"\n--- {fn} ---")
              with open(path) as fh:
                  body = fh.read()
              # Split on lines that are exactly 'GO' (T-SQL batch separator)
              batches = re.split(r'(?im)^\s*GO\s*$', body)
              for batch in batches:
                  batch = batch.strip()
                  if not batch:
                      continue
                  # Skip pure-comment batches
                  meaningful = "\n".join(
                      l for l in batch.splitlines() if l.strip() and not l.strip().startswith("--")
                  ).strip()
                  if not meaningful:
                      continue
                  cu.execute(batch)
              print("  applied")
          # Verify presence
          for t in ('Master_FOCUS_LIST','ARS_ALLOC_HEALTH_HISTORY','Master_ST_SPECIFIC'):
              n = cu.execute(
                  f"SELECT COUNT(*) FROM sys.objects WHERE type='U' AND name='{t}'"
              ).fetchone()[0]
              status = 'OK' if n else 'MISSING'
              print(f"  {t}: {status}")
              assert n, f"Migration verification failed for {t}"
          cn.close()
          print("\nAll three migrations verified.")
          PY

      - name: Remove temp firewall rule
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group "${{ vars.SQL_RG }}" \
            --server "${{ vars.SQL_SERVER }}" \
            --name "ghrun-${{ github.run_id }}-mig" || true

  ltr:
    name: Enable Long-Term Retention
    if: ${{ inputs.mode == 'ltr' || inputs.mode == 'migrate_and_ltr' }}
    needs: discovery
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set LTR policy (12W / 12M / 1Y)
        run: |
          az sql db ltr-policy set \
            --resource-group "${{ vars.SQL_RG }}" \
            --server "${{ vars.SQL_SERVER }}" \
            --database "${{ inputs.sql_db }}" \
            --weekly-retention P12W \
            --monthly-retention P12M \
            --yearly-retention P1Y \
            --week-of-year 1

      - name: Show resulting LTR policy
        run: |
          az sql db ltr-policy show \
            --resource-group "${{ vars.SQL_RG }}" \
            --server "${{ vars.SQL_SERVER }}" \
            --database "${{ inputs.sql_db }}" -o table
