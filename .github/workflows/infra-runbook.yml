name: Infra Runbook (manual)

# Manual-only workflow for prod migrations on Azure SQL.
# Uses pymssql (pip-only, no system ODBC driver). Requires Azure SQL
# "Allow Azure services" firewall toggle ON.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do (dry_run is read-only)'
        type: choice
        required: true
        default: dry_run
        options:
          - dry_run
          - migrate
      sql_db:
        description: 'Target Azure SQL database name'
        type: string
        required: true
        default: Rep_Data

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-22.04
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tests/e2e-majcat   # branch that carries 021/022/023 SQL files

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pymssql
        run: pip install pymssql==2.3.1

      - name: Run
        env:
          SQL_SERVER: ars-v2retail-sql.database.windows.net
          SQL_DB: ${{ inputs.sql_db }}
          SQL_USER: arsadmin
          SQL_PWD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          MODE: ${{ inputs.mode }}
        run: |
          python <<'PY'
          import os, re, pymssql
          mode = os.environ['MODE']
          cn = pymssql.connect(
              server=os.environ['SQL_SERVER'],
              user=os.environ['SQL_USER'],
              password=os.environ['SQL_PWD'],
              database=os.environ['SQL_DB'],
              port=1433,
              autocommit=True,
              login_timeout=30,
          )
          cu = cn.cursor()
          cu.execute("SELECT @@SERVERNAME, DB_NAME(), SUSER_NAME()")
          srv, db, who = cu.fetchone()
          print(f"Connected: server={srv} db={db} as={who} mode={mode}")

          cu.execute("""
              SELECT name FROM sys.objects
              WHERE type='U' AND name IN
                ('Master_FOCUS_LIST','ARS_ALLOC_HEALTH_HISTORY','Master_ST_SPECIFIC')
              ORDER BY name
          """)
          existing = [r[0] for r in cu.fetchall()]
          print(f"Target tables already present: {existing or 'none'}")
          cu.execute("SELECT COUNT(*) FROM sys.objects WHERE type='U' AND name LIKE 'Master_ALC_INPUT%'")
          n = cu.fetchone()[0]
          print(f"Master_ALC_INPUT_* tables on this DB: {n}")

          if mode == 'dry_run':
              print("dry_run: no changes made.")
              cn.close()
              raise SystemExit(0)

          targets = ('021_focus_list_table.sql',
                     '022_alloc_health_history.sql',
                     '023_st_specific_overrides.sql')
          for fn in targets:
              path = os.path.join('backend', 'scripts', fn)
              print(f"\n--- {fn} ---")
              with open(path) as fh:
                  body = fh.read()
              batches = re.split(r'(?im)^\s*GO\s*$', body)
              for batch in batches:
                  batch = batch.strip()
                  if not batch:
                      continue
                  meaningful = "\n".join(
                      l for l in batch.splitlines()
                      if l.strip() and not l.strip().startswith("--")
                  ).strip()
                  if not meaningful:
                      continue
                  cu.execute(batch)
              print("  applied")

          for t in ('Master_FOCUS_LIST', 'ARS_ALLOC_HEALTH_HISTORY', 'Master_ST_SPECIFIC'):
              cu.execute(f"SELECT COUNT(*) FROM sys.objects WHERE type='U' AND name=%s", (t,))
              cnt = cu.fetchone()[0]
              status = 'OK' if cnt else 'MISSING'
              print(f"  {t}: {status}")
              assert cnt, f"Migration verification failed for {t}"
          cn.close()
          print("\nAll three migrations verified.")
          PY
